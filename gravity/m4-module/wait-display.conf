# Gravity M4: the HDMI output comes up a few seconds after boot. If the login
# screen starts first it quits on the hotplug and leaves only a cursor.
# Wait (up to 20 s) until some connector reports modes before starting it.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 40); do cat /sys/class/drm/card*-*/modes 2>/dev/null | grep -q . && exit 0; sleep 0.5; done; exit 0'
