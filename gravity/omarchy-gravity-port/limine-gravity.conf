### Omarchy on the Mac mini M4 (J773g), booting Gravity Linux's proven M4 kernel
timeout: 5
quiet: no
verbose: yes
default_entry: 1
interface_branding: Omarchy Bootloader (Gravity M4 boot)
interface_branding_color: 9ece6a
hash_mismatch_panic: no

term_background: 1a1b26
backdrop: 1a1b26
term_foreground: c0caf5

/Omarchy (Gravity M4 kernel 7.1.13-509)
  protocol: efi
  path: boot():/gravity/gravity.efi

/Omarchy (Aurora kernel, normal - old boot chain)
  protocol: efi
  path: boot():/EFI/Linux/omarchy_linux-aurora.efi
  cmdline: root=UUID=4f4d5801-524f-4f54-8000-000000000001 rw rootflags=subvol=@,x-systemd.device-timeout=0 zswap.enabled=0 rootfstype=btrfs user4k=on quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0 plymouth.ignore-serial-consoles
