name: Build kernel release

# Lifted from the hub's daily-9.0.yml `build-kernel` job. Builds the pinned Fairydust + USB4 kernel,
# fetches the pinned m1n1 and u-boot packages, assembles boot.bin, writes kernel-manifest.json, and
# on a `kernel-*` tag attaches everything to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      tunnel:
        description: Also apply the experimental USB4 DP-tunnel patch (see fairydust/usb4/DP-TUNNEL-RE.md)
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "kernel-*"

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-kernel:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fast-apt

      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl dwarves flex \
            libdw-dev libelf-dev libncurses-dev libssl-dev libclang-dev clang \
            pahole python3 rsync rustc rust-src bindgen fakeroot debhelper
      - name: Install Rust standard-library sources
        run: |
          rustup show active-toolchain
          rustup component add rust-src --toolchain stable
          rustc --version
      - uses: ./.github/actions/ccache
      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-fairydust-${{ inputs.tunnel }}-${{ hashFiles('fairydust/debian/**', 'fairydust/PKGBUILD') }}-${{ github.run_id }}
          restore-keys: |
            ccache-fairydust-${{ inputs.tunnel }}-
      - name: Build pinned Fairydust kernel Debian package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.tunnel }}" == "true" ]]; then
            export FAIRYDUST_DP_TUNNEL=1
            kv='7.1.13-elementary-fairydust-usb4-dptunnel'
            pkgv='7.1.13+elementary.usb4-dp1'
          else
            kv='7.1.13-elementary-fairydust-usb4'
            pkgv='7.1.13+elementary.usb4.4'
          fi
          echo "kernel release: $kv (DP tunnel build: ${FAIRYDUST_DP_TUNNEL:-0})"
          archive="$RUNNER_TEMP/linux-ce9f2eba72c061a50b2d790450e90af3439d8c24.tar.gz"
          curl --fail --location --retry 4 --proto '=https' --tlsv1.2 \
            https://codeload.github.com/AsahiLinux/linux/tar.gz/ce9f2eba72c061a50b2d790450e90af3439d8c24 \
            --output "$archive"
          echo '20ce358acffff4b3de86201975cd68c7aaf241ae010ec3cca9422bbe2b7f34aa  '"$archive" | sha256sum --check
          FAIRYDUST_WORKDIR="$RUNNER_TEMP/fairydust" \
          FAIRYDUST_SOURCE_ARCHIVE="$archive" \
            bash fairydust/debian/build.sh --build
          mkdir -p out
          kernel_deb="$RUNNER_TEMP/fairydust/linux-image-${kv}_${pkgv}_arm64.deb"
          cp "$kernel_deb" out/
          fairydust/debian/fetch-asahi-boot-packages.sh out
          boot_inputs="$RUNNER_TEMP/fairydust-boot-inputs"
          mkdir -p "$boot_inputs/kernel" "$boot_inputs/m1n1" "$boot_inputs/u-boot"
          dpkg-deb -x "$kernel_deb" "$boot_inputs/kernel"
          dpkg-deb -x out/m1n1_1.5.2-2ubuntu0.1~asahi1_arm64.deb "$boot_inputs/m1n1"
          dpkg-deb -x out/u-boot-asahi_2025.10-2-1_arm64.deb "$boot_inputs/u-boot"
          python3 fairydust/debian/assemble-m1n1-bootbin.py \
            --m1n1 "$boot_inputs/m1n1/usr/lib/m1n1/m1n1.bin" \
            --dtb-dir "$boot_inputs/kernel/usr/lib/linux-image-${kv}/apple" \
            --u-boot "$boot_inputs/u-boot/usr/lib/u-boot/apple_m1/u-boot-nodtb.bin" \
            --output out/fairydust-m1n1-boot.bin
          (cd out && sha256sum fairydust-m1n1-boot.bin > FAIRYDUST-BOOT-SHA256SUMS)
          (cd out && sha256sum *.deb > SHA256SUMS)
      - name: Compiler cache statistics
        id: ccache-stats
        if: always()
        run: |
          ccache -s
          echo "misses=$(ccache --print-stats | awk -F'\t' '$1=="cache_miss" {print $2}')" >> "$GITHUB_OUTPUT"
      - name: Save compiler cache
        if: always() && steps.ccache-stats.outputs.misses != '0'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-fairydust-${{ inputs.tunnel }}-${{ hashFiles('fairydust/debian/**', 'fairydust/PKGBUILD') }}-${{ github.run_id }}
      - name: Write manifest and checksums
        run: python3 tools/make-manifest.py --out out --channel "fairydust-usb4" --commit "$GITHUB_SHA" --tunnel "${{ inputs.tunnel || 'false' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-packages-${{ github.run_id }}
          path: out/
          retention-days: 14
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/kernel-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Kernel release built by CI. See kernel-manifest.json for versions and sha256."
